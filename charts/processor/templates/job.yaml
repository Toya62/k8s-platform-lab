apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-processor-{{ .Release.Revision }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-processor
      automountServiceAccountToken: false
      containers:
        - name: processor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: JOB_ID
              value: "{{ .Release.Name }}-{{ .Release.Revision }}"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-processor-config
            - secretRef:
                name: {{ .Release.Name }}-aws-credentials
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
