{{- if .Values.setup.enabled }}
# Pre-install hook: creates the LocalStack bucket, test object and DynamoDB table.
# Hooks run before regular chart resources exist, so values are inlined (dummy lab credentials).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-setup
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: {{ .Values.setup.image }}
          command: ["/bin/sh", "-c"]
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.aws.accessKeyId | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.aws.secretAccessKey | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.aws.region | quote }}
            - name: EP
              value: {{ .Values.aws.endpointUrl | quote }}
          args:
            - |
              until aws --endpoint-url "$EP" s3api list-buckets >/dev/null 2>&1; do sleep 3; done
              aws --endpoint-url "$EP" s3api create-bucket --bucket {{ .Values.processor.bucket }} || true
              echo hello > /tmp/test.txt
              aws --endpoint-url "$EP" s3api put-object --bucket {{ .Values.processor.bucket }} --key {{ .Values.processor.key }} --body /tmp/test.txt --tagging "organization-id={{ .Values.processor.orgId }}"
              aws --endpoint-url "$EP" dynamodb create-table --table-name {{ .Values.processor.table }} \
                --attribute-definitions AttributeName=job_id,AttributeType=S AttributeName=timestamp,AttributeType=S \
                --key-schema AttributeName=job_id,KeyType=HASH AttributeName=timestamp,KeyType=RANGE \
                --billing-mode PAY_PER_REQUEST || true
{{- end }}
